# This is a basic workflow to help you get started with Actions

name: Hexo Auto-Deploy

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the main branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    name: Hexo Auto-Deploy By GitHub Actions
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    if: github.event.repository.owner.id == github.event.sender.id

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - name: 1. git checkout...
      uses: actions/checkout@v4

    - name: 2. setup pnpm...
      uses: pnpm/action-setup@v4

    - name: 3. setup nodejs...
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: pnpm

    - name: 4. install dependencies...
      run: pnpm install --frozen-lockfile

    - name: 5. setup env...
      env:
        SSH_PRIVATE_KEY: ${{ secrets.AKIAKISE_PRIVATE_KEY }}
      run: |
        mkdir -p ~/.ssh
        echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
        chmod 700 ~/.ssh
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan github.com >> ~/.ssh/known_hosts
        git config --global user.email "akiakise@outlook.com"
        git config --global user.name "akiakise"
        sudo timedatectl set-timezone Asia/Shanghai

    - name: 6. hexo generate...
      run: |
        pnpm exec hexo clean
        pnpm exec hexo generate

    - name: 7. hexo deploy...
      run: |
        pnpm exec hexo deploy
