# Stellar v2 站点配置
#
# 由 Stellar 1.29.1 迁移而来。这里只写本站实际使用、且与 v2 默认值不同的配置；
# 其余字段一律沿用主题 _config.yml 中的 v2 默认值。
# 迁移依据：https://xaoxuu.com/wiki/stellar/migration/fields/

# -----------------------------------------------------------------------------
# 布局
# -----------------------------------------------------------------------------

# 站点级 Leftbar。v1 的 logo 与 menubar 在 v2 合并为 brand 与 menu。
leftbar:
  brand:
    # v1 侧边栏顶部带搜索条；v2 中 search 默认为 true，这里无需重复声明。
    # v1: logo.avatar: '[{config.avatar}](/about/)'
    # v1: logo.title: '[{config.title}](/)'
    # v2 的图片与标题共用 href，这里取标题的链接（站点根）。
    image:
      src: '{config.avatar}'
      variant: avatar
    name: '{config.title}'
    # v1: logo.subtitle，原值为 '文案1 | 文案2'，悬停时切换到第二段。
    # v2 不再按 '|' 拆分，这里只保留第一段。
    tagline: 'Keep Calm and Carry On'
    href: /
  # v1: menubar.items
  menu:
    - id: post
      title: 博客
      # 与 v1 的 solar:documents-bold-duotone 是同一个图标。
      icon: 'default:documents'
      url: /
      accent: '#1BCDFC'
    - id: social
      title: 社交
      # 与 v1 的 solar:chat-square-like-bold-duotone 是同一个图标。
      icon: 'example:chat'
      url: /friends/
      accent: '#F44336'
  # v1: footer.social
  footer:
    actions:
      - type: link
        title: GitHub
        icon: 'https://gcore.jsdelivr.net/gh/cdn-x/placeholder@1.0.12/social/08a41b181ce68.svg'
        url: https://github.com/akiakise
      # v1 是一个 switchTheme() 单键循环按钮；v2 由 features.color_scheme_switch
      # 暴露 window.setColorScheme，这里拆成三个显式选项。
      - type: dropdown
        title: 配色
        icon: 'default:theme'
        items:
          - type: button
            title: 浅色
            onclick: "setColorScheme('light')"
          - type: button
            title: 深色
            onclick: "setColorScheme('dark')"
          - type: button
            title: 跟随系统
            onclick: "setColorScheme('auto')"

# 主内容区页脚。v1 的 blog_history 占位与内联脚本在 v2 拆成
# 「正文静态兜底 + inject.body_end 里的年份刷新」两部分。
footer:
  content: |
    <span id="blog_history">© 2017 - 2026 ♥ <a href="https://github.com/xaoxuu/hexo-theme-stellar" target="_blank">Stellar</a></span>

    本博客所有文章除特别声明外，均采用 <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank">CC BY-NC-SA 4.0</a> 许可协议，转载请注明出处。

# 页面与内容 Profile 的布局覆盖；未列出的 Profile 使用 v2 默认值。
# 全站不展示「最近更新」组件，因此所有默认带 recent 的 Profile 都显式声明
# 不含 recent 的 widgets 列表（v2 的 widgets 数组整体替换而非追加）。
profiles:
  home:
    leftbar:
      # v1: site_tree.home.leftbar: 'welcome, announcement, recent'
      widgets:
        - welcome
        - announcement

  blog_index:
    leftbar:
      # v2 默认: [recent]
      widgets: []

  post:
    leftbar:
      # v2 默认: [related, recent]
      widgets:
        - related

  topic:
    leftbar:
      # v2 默认: [related, recent]
      widgets:
        - related

  wiki_index:
    leftbar:
      # v2 默认: [related, recent]
      widgets:
        - related

  notebook:
    leftbar:
      # v2 默认: [tagtree, recent]
      widgets:
        - tagtree

  notebooks:
    leftbar:
      # v2 默认: [recent]
      widgets: []

  note:
    leftbar:
      # v2 默认: [tagtree, recent]
      widgets:
        - tagtree

  author:
    leftbar:
      # v2 默认: [recent]
      widgets: []

  page:
    leftbar:
      # v2 默认: [recent]
      widgets: []

  settings:
    leftbar:
      # v2 默认: [recent]
      widgets: []

  error:
    leftbar:
      # v2 默认: [recent]
      widgets: []

# -----------------------------------------------------------------------------
# 功能
# -----------------------------------------------------------------------------

# v1: comments.service: giscus。第三方参数保留原字段名。
comments:
  provider: giscus
  # v1: comments.comment_title
  title: Take it easy to comment or discuss / 欢迎评论或讨论
  giscus:
    js: https://giscus.app/client.js
    data-repo: akiakise/blog.akise.app
    data-repo-id: R_kgDOLkT3kg
    data-category: Announcements
    data-category-id: DIC_kwDOLkT3ks4CeK_U
    data-mapping: pathname
    data-strict: 0
    data-reactions-enabled: 1
    data-emit-metadata: 0
    data-input-position: top
    data-theme: preferred_color_scheme
    data-lang: zh-CN
    data-loading: null
    crossorigin: anonymous

features:
  # 对应 v1 位于页脚的 switchTheme() 按钮；开启后才提供 window.setColorScheme。
  color_scheme_switch:
    enabled: true
  diagrams:
    provider: mermaid
    mermaid:
      theme: neutral
# -----------------------------------------------------------------------------
# 高级注入
# -----------------------------------------------------------------------------

inject:
  # 保留 v1 页脚版权年份自动更新；目标元素不存在时静默跳过。
  body_end: |
    <script>
      (function () {
        var el = document.getElementById('blog_history');
        if (!el) return;
        el.innerHTML = '© 2017 - ' + new Date().getFullYear() +
          ' ♥ <a href="https://github.com/xaoxuu/hexo-theme-stellar" target="_blank">Stellar</a>';
      })();
    </script>
